# FVS East Cascades (EC) Variant Species Configuration
# 32 species recognized in the EC variant
# Source: ForestVegetationSimulator/ec/blkdat.f

metadata:
  variant: EC
  variant_name: "FVS East Cascades"
  description: "FVS variant for the eastern slope of the Cascade Range in Oregon and Washington"
  region: "East Cascades (Oregon and Washington)"
  source: "ForestVegetationSimulator/ec/blkdat.f"
  default_site_species: DF
  default_site_index: 100
  base_cycle: 10

coefficient_files:
  diameter_growth: "ec_diameter_growth_coefficients.json"

functional_forms_file: "functional_forms.yaml"

