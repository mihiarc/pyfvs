site_name: PyFVS - Python Forest Vegetation Simulator
site_description: Python implementation of the Forest Vegetation Simulator (FVS) supporting 10 regional variants for simulating forest growth and yield across the United States.
site_author: Christopher Mihiar
site_url: https://mihiarc.github.io/pyfvs/
repo_url: https://github.com/mihiarc/pyfvs
repo_name: mihiarc/pyfvs

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mihiarc/pyfvs
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/fvs-python/
  meta:
    - name: keywords
      content: pyfvs, fvs, forest vegetation simulator, python, growth modeling, yield tables, forestry, usda
    - name: author
      content: Christopher Mihiar, USDA Forest Service
    - property: og:title
      content: PyFVS - Python Forest Vegetation Simulator
    - property: og:description
      content: Python implementation of FVS supporting 10 regional variants for forest growth and yield simulation.
    - property: og:type
      content: website
    - property: og:url
      content: https://mihiarc.github.io/pyfvs/
    - property: og:site_name
      content: PyFVS Documentation
    - name: twitter:card
      content: summary_large_image
    - name: twitter:title
      content: PyFVS - Python Forest Vegetation Simulator
    - name: twitter:description
      content: Python implementation of FVS supporting 10 regional variants for forest growth and yield simulation.

theme:
  name: material
  palette:
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - toc.follow
    - search.suggest
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            docstring_section_style: spacy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Workaround for pymdownx/Pygments None-filename crash (see mkdocs_hooks.py)
hooks:
  - mkdocs_hooks.py

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Core Concepts:
    - Overview: concepts/index.md
    - Growth Models: concepts/growth-models.md
    - Stand Dynamics: concepts/stand-dynamics.md
    - Volume & Taper: concepts/volume.md
  - Variants: variants/index.md
  - Guides:
    - Ecological Units: guides/ecological-units.md
    - Harvest Operations: guides/harvesting.md
  - API Reference:
    - Overview: api/index.md
    - Stand: api/stand.md
    - Tree: api/tree.md
    - SimulationEngine: api/simulation-engine.md
  - Cookbook: cookbook.md

# Engineering notes kept in the repo but not published to the site
exclude_docs: |
  sn_fidelity_map.md
  ls_fidelity_map.md
  development/
